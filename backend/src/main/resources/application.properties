server.port=8080

spring.application.name=DayMind AI Backend

# Database Configuration (Defaults to persistent H2 file DB, customizable via Env Vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/dayminddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Gemini AI Key
gemini.api.key=AIzaSyCY2pCZ1_zLPLFdOiAz2R3JNvvwyzpee-c

# Logging
logging.level.com.daymind=INFO

