server.port=8080

spring.application.name=DayMind AI Backend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:dayminddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Gemini AI Key
gemini.api.key=AIzaSyCY2pCZ1_zLPLFdOiAz2R3JNvvwyzpee-c

# Logging
logging.level.com.daymind=INFO

